name: v2.1 synthetic integrity tests

on:
  push:
    paths:
      - "src/104_build_corrected_landmark12_v2_1_cohorts.py"
      - "src/105_build_enhanced_structured_baseline_v2_1.py"
      - "src/106_freeze_enhanced_structured_cv_splits_v2_1.py"
      - "src/107_evaluate_enhanced_structured_baseline_v2_1.py"
      - "src/preregistration_stats.py"
      - "src/registration_gate.py"
      - "tests/test_v2_1_integrity.py"
      - "config/corrected_landmark12_v2_1_expected_counts.json"
      - ".github/workflows/v2_1_integrity_tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_v2_1_integrity.py"

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas scikit-learn
      - run: PYTHONPATH=src python -m unittest tests.test_v2_1_integrity -v
