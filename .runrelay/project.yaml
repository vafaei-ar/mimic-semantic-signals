schema_version: 1

project:
  id: mimic-semantic-signals
  repo: vafaei-ar/mimic-semantic-signals
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: false
  network_access: false
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: false
  tmux_default: false

tasks:
  evaluate_population_landmark12_semantic_extension:
    description: Evaluate the frozen full-population 12-hour semantic extension with structured, note-context, Open-Jev, Laya, TF-IDF, and lexical-plus-semantic models using the same patient-grouped folds and paired patient-cluster bootstrap comparisons; share aggregate metrics only.
    command:
      - bash
      - scripts/run_population_landmark12_semantic_extension.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 24
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/multitask_benchmark/population_landmark12_semantic_extension_v1.json

  infer_population_landmark12_openjev:
    description: Run the frozen Open-Jev representation fully offline on the 36,117 deduplicated 12-hour population-landmark notes; row-level scores remain local and only aggregate inference diagnostics are shared.
    command:
      - bash
      - scripts/run_population_landmark12_openjev.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 16
      gpu_count: 1
      min_vram_gb: 12
      wait_minutes: 60
    artifacts:
      - outputs/multitask_benchmark/population_landmark12_openjev_inference_v1.json

  infer_population_landmark12_laya:
    description: Run the frozen pinned Laya representation fully offline on the 36,117 deduplicated 12-hour population-landmark notes; row-level scores remain local and only aggregate inference diagnostics are shared.
    command:
      - bash
      - scripts/run_population_landmark12_laya.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 16
      gpu_count: 1
      min_vram_gb: 12
      wait_minutes: 60
    artifacts:
      - outputs/multitask_benchmark/population_landmark12_laya_inference_v1.json

  build_population_landmark12_note_workload:
    description: Deduplicate the frozen 12-hour landmark predictor notes across ventilation, RRT, and ICU death by exact note text without reading labels; materialize a local unique corpus and share aggregate workload counts only.
    command:
      - bash
      - scripts/run_population_landmark12_note_workload.sh
    approval: automatic
    timeout_minutes: 30
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 15
    artifacts:
