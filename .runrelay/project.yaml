schema_version: 1

project:
  id: mimic-semantic-signals
  repo: vafaei-ar/mimic-semantic-signals
  visibility: public

execution:
  profile: safe
  approval_default: manual
  machine_binding: fixed
  machine_id: pshjl4vf24
  runner_source: runrelay_control_repo
  exact_commit: true
  allow_arbitrary_commands: false

security:
  project_only_filesystem: false
  network_access: false
  inherit_environment: false
  destructive_operations: false

monitoring:
  heartbeat_seconds: 60
  telegram_include_log_tail: false
  tmux_default: false

tasks:
  audit_external_pressors:
    description: Curate and audit first vasopressor initiation endpoints in local eICU and NWICU datasets.
    command:
      - bash
      - scripts/run_external_pressor_audit.sh
    approval: manual
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/external_validation/external_pressor_endpoint_audit.json

  build_external_risksets:
    description: Build six-hour structured vasopressor risk-set cohorts in local eICU and NWICU data and share only an aggregate report.
    command:
      - bash
      - scripts/run_external_riskset_build.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/external_validation/external_structured_riskset_report.json

  audit_structured_mappings:
    description: Audit NWICU blood-pressure item mappings and MIMIC-III vasopressor item 30125 using local dictionaries and aggregate usage counts.
    command:
      - bash
      - scripts/run_structured_mapping_audit.sh
    approval: automatic
    timeout_minutes: 60
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 1
      min_ram_gb: 4
      gpu_count: 0
      wait_minutes: 15
    artifacts:
      - outputs/external_validation/structured_mapping_audit.json

  build_mimic_exact6h:
    description: Build the MIMIC-III exact-6h structured vasopressor development cohort aligned to external risk-set sampling.
    command:
      - bash
      - scripts/run_mimic_exact6h_build.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/external_validation/mimic_exact6h_structured_report.json

  evaluate_structured_transport:
    description: Train frozen exact-6h MIMIC portable physiology models and apply them without refitting to eICU and NWICU; share only aggregate performance.
    command:
      - bash
      - scripts/run_structured_transport.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/external_validation/structured_transport_report.json

  build_primary_corrected:
    description: Rebuild the primary MIMIC note-anchored vasopressor cohort using only norepinephrine, epinephrine, phenylephrine, dopamine, and vasopressin.
    command:
      - bash
      - scripts/run_primary_corrected_build.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v3_corrected/cohort_manifest.json

  infer_primary_corrected_openjev:
    description: Run cached Open-Jev offline on the corrected primary MIMIC note cohort; predictions remain local.
    command:
      - bash
      - scripts/run_primary_corrected_openjev.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  infer_primary_corrected_laya:
    description: Run cached Laya typed-decisions offline on the corrected primary MIMIC note cohort; predictions remain local.
    command:
      - bash
      - scripts/run_primary_corrected_laya.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  evaluate_primary_corrected_openjev:
    description: Evaluate corrected Open-Jev semantic increment over physiology and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_corrected_eval_openjev.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v3_corrected/open_jev/report.json

  evaluate_primary_corrected_laya:
    description: Evaluate corrected Laya semantic increment over physiology and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_corrected_eval_laya.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v3_corrected/laya/report.json

  build_primary_prospective:
    description: Rebuild the primary MIMIC note-anchored cohort with the five-pressor endpoint and prospective note availability based on STORETIME/CHARTTIME.
    command:
      - bash
      - scripts/run_primary_prospective_build.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v4_prospective/cohort_manifest.json

  infer_primary_prospective_openjev:
    description: Run cached Open-Jev offline on the prospective corrected primary MIMIC note cohort; predictions remain local.
    command:
      - bash
      - scripts/run_primary_prospective_openjev.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  infer_primary_prospective_laya:
    description: Run cached Laya typed-decisions offline on the prospective corrected primary MIMIC note cohort; predictions remain local.
    command:
      - bash
      - scripts/run_primary_prospective_laya.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  evaluate_primary_prospective_openjev:
    description: Evaluate Open-Jev semantic increment in the prospective corrected primary cohort and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_prospective_eval_openjev.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v4_prospective/open_jev/report.json

  evaluate_primary_prospective_laya:
    description: Evaluate Laya semantic increment in the prospective corrected primary cohort and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_prospective_eval_laya.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v4_prospective/laya/report.json

  build_primary_v5:
    description: Build the final corrected prospective MIMIC note cohort after excluding blank notes before matching and verifying exact 1:3 matched-set integrity.
    command:
      - bash
      - scripts/run_primary_v5_build.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/cohort_manifest.json

  infer_primary_v5_openjev:
    description: Run cached Open-Jev offline on the final complete-matched prospective cohort; row-level predictions remain local.
    command:
      - bash
      - scripts/run_primary_v5_openjev.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  infer_primary_v5_laya:
    description: Run cached Laya offline on the final complete-matched prospective cohort; row-level predictions remain local.
    command:
      - bash
      - scripts/run_primary_v5_laya.sh
    approval: automatic
    timeout_minutes: 360
    requires_gpu: true
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 1
      min_vram_gb: 6
      wait_minutes: 60

  evaluate_primary_v5_openjev:
    description: Evaluate Open-Jev semantic increment in the final complete-matched prospective cohort and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_v5_eval_openjev.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/open_jev/report.json

  evaluate_primary_v5_laya:
    description: Evaluate Laya semantic increment in the final complete-matched prospective cohort and share aggregate metrics only.
    command:
      - bash
      - scripts/run_primary_v5_eval_laya.sh
    approval: automatic
    timeout_minutes: 120
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/laya/report.json

  evaluate_v5_lexical_robustness:
    description: Compare frozen v5 physiology and semantic models against a fold-fitted TF-IDF lexical baseline; share aggregate metrics only.
    command:
      - bash
      - scripts/run_v5_lexical_robustness.sh
    approval: automatic
    timeout_minutes: 240
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/robustness/lexical_report.json

  evaluate_v5_nonlinear_robustness:
    description: Test whether Open-Jev and Laya semantics add discrimination beyond a prespecified nonlinear structured physiology comparator.
    command:
      - bash
      - scripts/run_v5_nonlinear_robustness.sh
    approval: automatic
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/robustness/nonlinear_structured_report.json

  evaluate_v5_nonlinear_rf_robustness:
    description: Run a post-timeout random-forest nonlinear structured sensitivity with the frozen v5 cohort and share aggregate metrics only.
    command:
      - bash
      - scripts/run_v5_nonlinear_rf_robustness.sh
    approval: automatic
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/robustness/nonlinear_rf_structured_report.json

  evaluate_v5_treatment_language_sensitivity:
    description: Audit broader hemodynamic treatment-management wording and re-evaluate semantic increment in complete matched sets free of flagged language; share aggregate metrics only.
    command:
      - bash
      - scripts/run_v5_treatment_language_sensitivity.sh
    approval: automatic
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/robustness/treatment_language_sensitivity_report.json

  evaluate_v5_lead_time_sensitivity:
    description: Reconstruct and verify frozen v5 case lead times locally, then test semantic increment after requiring case notes to be available at least 0, 1, 2, 3, and 4 hours before first vasopressor initiation; share aggregate metrics only.
    command:
      - bash
      - scripts/run_v5_lead_time_sensitivity.sh
    approval: automatic
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 4
      min_ram_gb: 12
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/vasopressor_incremental_v5_complete_matched/robustness/lead_time_sensitivity_report.json

  evaluate_transport_missingness_sensitivity:
    description: Re-evaluate frozen MIMIC to eICU/NWICU structured transport without missingness indicators and compare with the original indicator-based transport report.
    command:
      - bash
      - scripts/run_transport_missingness_sensitivity.sh
    approval: automatic
    timeout_minutes: 180
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 2
      min_ram_gb: 8
      gpu_count: 0
      wait_minutes: 30
    artifacts:
      - outputs/external_validation/structured_transport_values_only_sensitivity.json

  validate_manuscript_robustness:
    description: Compile-check the new manuscript robustness scripts before long analyses.
    command:
      - bash
      - scripts/validate_manuscript_robustness.sh
    approval: automatic
    timeout_minutes: 20
    requires_gpu: false
    working_directory: .
    resources:
      cpu_cores: 1
      min_ram_gb: 2
      gpu_count: 0
      wait_minutes: 10
