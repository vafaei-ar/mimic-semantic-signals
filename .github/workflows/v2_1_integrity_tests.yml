name: v2.1 synthetic integrity tests

on:
  push:
    paths:
      - "src/104_build_corrected_landmark12_v2_1_cohorts.py"
      - "src/105_build_enhanced_structured_baseline_v2_1.py"
      - "src/106_freeze_enhanced_structured_cv_splits_v2_1.py"
      - "src/107_evaluate_enhanced_structured_baseline_v2_1.py"
      - "src/108_quarantine_pre_registration_e8.py"
      - "src/109_audit_preregistration_context_v2_1.py"
      - "src/110_simulate_preregistration_power_v2_1.py"
      - "src/111_benchmark_refit_bootstrap_v2_1.py"
      - "src/112_audit_death_source_strategy_v2_1.py"
      - "src/113_audit_treatment_context_availability_v2_1.py"
      - "src/114_build_preregistration_context_features_v2_1.py"
      - "src/115_build_fixed_note_corpora_v2_1.py"
      - "scripts/run_build_fixed_note_corpora_v2_1.sh"
      - "config/v2_1_language_stripping_freeze.json"
      - "config/v2_1_fixed_note_corpus_result_contract.json"
      - "scripts/run_build_preregistration_context_features_v2_1.sh"
      - "config/v2_1_context_feature_freeze.json"
      - "config/v2_1_context_feature_result_contract.json"
      - "scripts/run_v2_1_preregistration_synthetic_checks.sh"
      - "scripts/run_freeze_enhanced_structured_cv_splits_v2_1.sh"
      - "scripts/run_preregistration_power_v2_1.sh"
      - "scripts/run_refit_bootstrap_benchmark_v2_1.sh"
      - "scripts/run_death_source_strategy_audit_v2_1.sh"
      - "scripts/run_treatment_context_availability_audit_v2_1.sh"
      - "src/preregistration_stats.py"
      - "src/registration_gate.py"
      - "tests/test_v2_1_integrity.py"
      - "config/corrected_landmark12_v2_1_expected_counts.json"
      - "config/v2_1_analysis_population_contract.json"
      - ".github/workflows/v2_1_integrity_tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_v2_1_integrity.py"

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas scikit-learn
      - run: PYTHONPATH=src python -m unittest tests.test_v2_1_integrity -v
